name: Release

# Push a tag like v2.0.0 (matching package.json "version") to build, attach the zip to a
# GitHub release and submit it to the Chrome Web Store.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run zip
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Submit to Chrome Web Store
        if: ${{ env.CHROME_REFRESH_TOKEN != '' }}
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
