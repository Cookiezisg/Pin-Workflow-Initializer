<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6BFF"/>
      <stop offset="1" stop-color="#3A28B5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A6B"/>
      <stop offset="1" stop-color="#F0485A"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#160b5c" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>
  <!-- other workspaces stacked behind -->
  <rect x="30" y="30" width="72" height="56" rx="9" fill="#fff" opacity=".25"/>
  <rect x="26" y="37" width="72" height="56" rx="9" fill="#fff" opacity=".45"/>
  <!-- browser window -->
  <g filter="url(#sh)">
    <rect x="22" y="44" width="72" height="58" rx="9" fill="#fff"/>
  </g>
  <!-- tab strip: active tab + two others -->
  <rect x="22" y="44" width="72" height="14" rx="9" fill="#E6E2FF"/>
  <rect x="22" y="51" width="72" height="7" fill="#E6E2FF"/>
  <rect x="28" y="48" width="22" height="10" rx="3" fill="#fff"/>
  <rect x="53" y="50.5" width="14" height="4" rx="2" fill="#B9B0FF"/>
  <rect x="70" y="50.5" width="14" height="4" rx="2" fill="#B9B0FF"/>
  <!-- content lines -->
  <rect x="30" y="68" width="40" height="5" rx="2.5" fill="#DAD5FF"/>
  <rect x="30" y="78" width="28" height="5" rx="2.5" fill="#DAD5FF"/>
  <rect x="30" y="88" width="34" height="5" rx="2.5" fill="#DAD5FF"/>
  <!-- pin, pinning the window's corner -->
  <g transform="translate(92 46) rotate(40)" filter="url(#sh)">
    <rect x="-1.8" y="4" width="3.6" height="20" rx="1.8" fill="#2A1C8F"/>
    <path d="M-12 -26 h24 a3 3 0 0 1 1.8 5.4 l-4.8 3.6 v10 l9 7.5 a2 2 0 0 1 -1.3 3.5 h-33.4 a2 2 0 0 1 -1.3 -3.5 l9 -7.5 v-10 l-4.8 -3.6 a3 3 0 0 1 1.8 -5.4z" fill="url(#pin)"/>
    <rect x="-5" y="-18" width="3" height="11" rx="1.5" fill="#fff" opacity=".35"/>
  </g>
</svg>
